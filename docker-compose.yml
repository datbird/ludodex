services:
  ludodex:
    build: .
    image: ludodex:latest
    container_name: ludodex
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env                       # copy .env.example → .env and fill in
    volumes:
      - ludodex-data:/data         # SQLite DBs + config + tokens (small, critical)
      #
      # Optional: put downloaded ART on separate/larger storage — mount a WRITABLE
      # volume at /media and ludodex uses it automatically (no env var needed).
      # /media is the art REPO: ludodex writes into it. A read-only mount here is
      # ignored (the entrypoint says so and falls back to /data/media).
      # - ludodex-media:/media
      # - /srv/ludodex-media:/media
      #
      # Optional: expose your ROM / media SHARE — a different thing entirely. Mount it
      # on the host, bind it in READ-ONLY at any path EXCEPT /media, then point a
      # "Local" device at that path in the UI.
      # - /srv/roms:/library:ro

volumes:
  ludodex-data:
  # ludodex-media:   # uncomment if you split media onto a named volume above
