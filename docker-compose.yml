services:
  ludodex:
    build: .
    image: ludodex:latest
    container_name: ludodex
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env                       # copy .env.example → .env and fill in
    volumes:
      - ludodex-data:/data         # SQLite DBs + config + tokens (small, critical)
      # Optional: put downloaded media on separate/larger storage — just mount a
      # volume at /media and ludodex uses it automatically (no env var needed):
      # - ludodex-media:/media
      # - <media-share>:/media
      #
      # Optional: expose an NFS/SMB share already mounted on the host, then point
      # a "Local" device at it in the UI:
      # - /mnt/media:/library:ro

    # --- Mounting SMB/NFS *from inside* the container (instead of on the host)
    # needs elevated privileges. Leave commented unless you use the in-container
    # mount transport; the host-mount approach above needs none of this.
    # cap_add:
    #   - SYS_ADMIN
    #   - DAC_READ_SEARCH
    # security_opt:
    #   - apparmor:unconfined
    # devices:
    #   - /dev/fuse

volumes:
  ludodex-data:
  # ludodex-media:   # uncomment if you split media onto a named volume above
