# ludodex — RESOLVED Python dependency versions (the lock).
#
# requirements.txt says WHAT the app depends on and why. This file says WHICH VERSIONS
# a build gets. Without it every `>=` floor re-resolves at build time, so two images
# built a week apart contain different libraries and a failure that reproduces on one
# does not reproduce on the other. The web side has had `pnpm-lock.yaml` +
# `--frozen-lockfile` from the start; this is the Python half of the same guarantee.
#
# The Dockerfile installs `-r requirements.txt -c requirements.lock`: requirements.txt
# stays the readable statement of intent, this file pins the outcome, and pip refuses
# any version that contradicts it. tests/test_repo_packaging.py fails if a direct
# dependency is missing here, so adding one to requirements.txt without re-locking is
# caught in the suite rather than at build time.
#
# TO REGENERATE (from a checkout, on Python 3.12 to match the image):
#
#     python3 -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -q --upgrade pip
#     /tmp/lockenv/bin/pip install --dry-run --ignore-installed \
#         --report /tmp/report.json -r requirements.txt
#     # then rewrite the block below from /tmp/report.json ("install"[].metadata)
#
# Resolved 2026-08-24. Lines marked (direct) are named in requirements.txt; the rest are
# transitive and are pinned for exactly the same reason.

